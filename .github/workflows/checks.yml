name: repository-checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - "127.0.0.1:56379:6379"
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      MORPHY_EMBEDDINGS: "off"
      MORPHY_TEST_REDIS_URL: redis://127.0.0.1:56379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements-parquet.txt pytest
      - run: python -m pytest tests -q
        working-directory: backend
      - run: python -m pip install -e ./cli
      - run: morphy --help
      - run: sq --help
      - run: python -m pytest cli/tests -q
      - run: python -m compileall -q cli/morphy_cli backend/app

  sql-policies:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - "127.0.0.1:55422:5432"
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: fixture-root
        ports:
          - "127.0.0.1:55336:3306"
        options: --health-cmd "mysqladmin ping --silent" --health-interval 5s --health-timeout 3s --health-retries 20
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: fixture-root
        ports:
          - "127.0.0.1:55337:3306"
        options: --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: "55422"
      PGUSER: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations and verify authenticated policies
        run: |
          psql -X -v ON_ERROR_STOP=1 -f tests/postgres-fixture.sql
          for migration in migrations/*.sql; do psql -X -v ON_ERROR_STOP=1 -f "$migration"; done
          psql -X -v ON_ERROR_STOP=1 -f tests/control-plane.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/saved-queries.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/dashboards.sql
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements-parquet.txt pytest
      - name: Verify live PostgreSQL API policy integration
        env:
          MORPHY_INTEGRATION_DSN: postgresql://postgres@127.0.0.1:55422/postgres
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          MORPHY_EMBEDDINGS: "off"
        run: python -m pytest tests/test_live_engine.py tests/test_account_lifecycle.py -q
        working-directory: backend
      - name: Set up MySQL and MariaDB source fixtures
        run: |
          docker exec -i -e MYSQL_PWD=fixture-root ${{ job.services.mysql.id }} mysql -uroot --default-character-set=utf8mb4 < tests/mysql-family.sql
          docker exec -i -e MYSQL_PWD=fixture-root ${{ job.services.mariadb.id }} mariadb -uroot --default-character-set=utf8mb4 < tests/mysql-family.sql
      - name: Verify MySQL-family API policy integration
        env:
          MORPHY_INTEGRATION_DSN: postgresql://postgres@127.0.0.1:55422/postgres
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          MORPHY_EMBEDDINGS: "off"
        run: |
          MORPHY_TEST_MYSQL_URI='mysql://morphy_reader:fixture-read-only@127.0.0.1:55336/morphy_fixture?sslmode=disable' python -m pytest tests/test_mysql.py -q
          MORPHY_TEST_MYSQL_URI='mariadb://morphy_reader:fixture-read-only@127.0.0.1:55337/morphy_fixture?sslmode=disable' python -m pytest tests/test_mysql.py -q
        working-directory: backend

  cli-cross-platform:
    name: CLI on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CLI and test framework
        run: python -m pip install -e ./cli pytest
      - name: Verify console command morphy
        run: morphy --help
      - name: Verify console command sq
        run: sq --help
      - name: Run CLI test suite (including token refresh and exit codes)
        run: python -m pytest cli/tests -v

