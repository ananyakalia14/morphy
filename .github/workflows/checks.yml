name: repository-checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  backend:
    runs-on: ubuntu-latest
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      MORPHY_EMBEDDINGS: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements.txt pytest
      - run: python -m pytest tests -q
        working-directory: backend
      - run: python -m pip install -e ./cli
      - run: morphy --help
      - run: python -m compileall -q cli/morphy_cli backend/app

  sql-policies:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - "127.0.0.1:55422:5432"
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "55422"
      PGUSER: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations and verify authenticated policies
        run: |
          psql -X -v ON_ERROR_STOP=1 -f tests/postgres-fixture.sql
          for migration in migrations/*.sql; do psql -X -v ON_ERROR_STOP=1 -f "$migration"; done
          psql -X -v ON_ERROR_STOP=1 -f tests/control-plane.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/saved-queries.sql
