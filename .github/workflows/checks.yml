name: repository-checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - "127.0.0.1:56379:6379"
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      MORPHY_EMBEDDINGS: "off"
      MORPHY_TEST_REDIS_URL: redis://127.0.0.1:56379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements.txt pytest
      - run: python -m pytest tests -q
        working-directory: backend
      - run: python -m pip install -e ./cli
      - run: morphy --help
      - run: sq --help
      - run: python -m pytest cli/tests -q
      - run: python -m compileall -q cli/morphy_cli backend/app

  sql-policies:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - "127.0.0.1:55422:5432"
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "55422"
      PGUSER: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations and verify authenticated policies
        run: |
          psql -X -v ON_ERROR_STOP=1 -f tests/postgres-fixture.sql
          for migration in migrations/*.sql; do psql -X -v ON_ERROR_STOP=1 -f "$migration"; done
          psql -X -v ON_ERROR_STOP=1 -f tests/control-plane.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/saved-queries.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/dashboards.sql
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements.txt pytest
      - name: Verify live PostgreSQL API policy integration
        env:
          MORPHY_INTEGRATION_DSN: postgresql://postgres@127.0.0.1:55422/postgres
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          MORPHY_EMBEDDINGS: "off"
        run: python -m pytest tests/test_live_engine.py tests/test_account_lifecycle.py -q
        working-directory: backend
