[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "morphy-cli"
version = "0.4.0"
description = "MORPHY governed query terminal"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]

[project.scripts]
morphy = "morphy_cli.main:main"
sq = "morphy_cli.main:main"
